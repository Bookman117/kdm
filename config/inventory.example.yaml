apiVersion: kdm.io/v2alpha1
kind: Inventory
metadata:
  name: lab
spec:
  ssh:
    user: ubuntu
    port: 22
    connectTimeoutSeconds: 5
    hostKeyPolicy: accept-new
  nodes:
    - name: cp-1
      address: 192.0.2.11
      role: control-plane
    - name: wk-1
      address: 192.0.2.21
      role: worker
